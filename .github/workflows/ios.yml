name: iOS build (unsigned ipa)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'
      - '*.js'
      - '*.css'
      - '*.html'
      - 'vendor/**'
      - 'manifest.webmanifest'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version

      - name: Install Capacitor
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Check JS syntax
        run: for f in *.js; do node --check "$f" || exit 1; done

      - name: Prepare web assets
        working-directory: native
        run: npm run www

      - name: Generate iOS project
        working-directory: native
        run: npx cap add ios --skip-deps || npx cap add ios || true

      - name: Configure Info.plist and deployment target (before pod install)
        working-directory: native/ios/App
        run: |
          PLIST=App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Камера нужна для фото стен и обмера комнат лидаром'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/g' App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '17.0'/" Podfile
          grep -n "platform :ios" Podfile

      - name: App icon and splash (house)
        working-directory: native/ios/App/App/Assets.xcassets
        run: |
          set -e
          ICON=$GITHUB_WORKSPACE/native/resources/icon-1024.png
          SPLASH=$GITHUB_WORKSPACE/native/resources/splash-2732.png
          for f in AppIcon.appiconset/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            sips -z "$w" "$w" "$ICON" --out "$f" >/dev/null
            echo "icon -> $f ($w)"
          done
          for f in Splash.imageset/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            sips -z "$h" "$w" "$SPLASH" --out "$f" >/dev/null
            echo "splash -> $f ($w x $h)"
          done

      - name: Sync plugins and install pods
        working-directory: native
        run: npx cap sync ios

      - name: Build (no code signing)
        working-directory: native/ios/App
        run: |
          set -o pipefail
          if ! xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1; then
            echo "::error::xcodebuild failed"
            echo "----- errors -----"; grep -nE "error:" xcodebuild.log | head -60 || true
            echo "----- tail -----"; tail -80 xcodebuild.log
            exit 1
          fi
          grep -E "BUILD SUCCEEDED" xcodebuild.log
          grep -E "warning:.*swift" xcodebuild.log | head -30 || true
          APP=build/Build/Products/Release-iphoneos/App.app
          test -d "$APP" || { echo "::error::App.app not found"; ls -R build/Build/Products | head -50; exit 1; }
          du -sh "$APP"

      - name: Package ipa
        working-directory: native/ios/App
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Stenograf-unsigned.ipa Payload
          ls -la Stenograf-unsigned.ipa
          # проверяем содержимое, а не размер: исполняемый файл, веб-часть, модуль лидара, иконка
          for need in Payload/App.app/App Payload/App.app/public/index.html Payload/App.app/public/templates.js                       Payload/App.app/Frameworks/StenografRoomplan.framework/StenografRoomplan; do
            test -e "$need" || { echo "::error::в сборке нет $need"; exit 1; }
          done
          ls Payload/App.app | grep -q '^AppIcon' || { echo "::error::в сборке нет иконки"; exit 1; }
          echo "ipa OK: $(stat -f%z Stenograf-unsigned.ipa) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Stenograf-unsigned-ipa
          path: native/ios/App/Stenograf-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: native/ios/App/xcodebuild.log
          if-no-files-found: ignore
